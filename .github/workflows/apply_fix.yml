name: Apply fix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scompatta e committa
        run: |
          ls *.zip
          unzip -o ai-stock-advisor-files*.zip -x ".github/*"
          rm -f ai-stock-advisor*.zip
          git config user.name "AI Stock Advisor"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Applica fix"
          git push